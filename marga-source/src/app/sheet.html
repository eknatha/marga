<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}} cheat sheet | MARGA by EknathaLabs</title>
<meta name="description" content="{{SUMMARY}}">
<link rel="canonical" href="{{SITE}}/cheatsheets/{{ID}}.html">
<meta property="og:title" content="{{TITLE}} cheat sheet">
<meta property="og:description" content="{{SUMMARY}}">
<meta property="og:url" content="{{SITE}}/cheatsheets/{{ID}}.html">
<meta name="theme-color" content="#0F2547">
<link rel="icon" href="../icon.svg" type="image/svg+xml">
<script>
(function(){try{var t=localStorage.getItem('ea.theme');if(!t){t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}document.documentElement.setAttribute('data-theme',t);}catch(e){document.documentElement.setAttribute('data-theme','light');}})();
</script>
<link rel="stylesheet" href="../assets/app.css?v={{VER}}">
<script src="../assets/a11y.js?v={{VER}}"></script>
</head>
<body class="standalone">
<header class="topbar"><div class="wrap topbar-in">
  <a class="brand" href="../"><img src="../icon.svg" alt="" width="26" height="26"><span><b>MARGA</b><span class="bn"> by EknathaLabs</span></span></a>
  <nav class="topnav" aria-label="Cheat sheets"><a href="./">All cheat sheets</a><a href="../#/">Learning paths</a><a href="../#/interview">InterviewHub</a></nav>
</div></header>
<main class="wrap sheet-page" id="main">
  <header class="page-head">
    <h1>{{TITLE}} cheat sheet</h1>
    <p class="lede">{{SUMMARY}}</p>
    <div class="actions"><button class="btn btn-quiet" type="button" data-print>Print</button><button class="btn btn-quiet" type="button" data-print data-pdf>Save as PDF</button></div>
    <p id="pdf-hint" class="small" hidden>In the print dialog, choose "Save as PDF" as the destination.</p>
    <div id="voice-slot"></div>
  </header>
  <article class="sheet">{{BODY}}</article>
  {{REFS}}
</main>
<footer class="foot"><div class="wrap foot-in"><span>MARGA by EknathaLabs</span><a href="../#/interview">InterviewHub</a><span class="visitors" id="visitors" hidden></span><p class="foot-promise">Free · No login · No ads · No cookies</p></div></footer>
<script src="../assets/voice.js?v={{VER}}"></script>
<script src="../assets/counter.js?v={{VER}}"></script>
<script>
if(window.MargaCounter&&'{{COUNTER}}'){MargaCounter.init('{{COUNTER}}','#visitors');MargaCounter.hit(location.pathname.replace(/^.*\/cheatsheets\//,'/cheatsheets/'),document.title);}
document.querySelectorAll('[data-print]').forEach(function(b){b.addEventListener('click',function(){if(window.MargaVoice)MargaVoice.stop();if(b.hasAttribute('data-pdf')){var n=document.getElementById('pdf-hint');if(n)n.hidden=false;}window.print();});});
if(window.MargaVoice){MargaVoice.mount(document.getElementById('voice-slot'),function(){return document.querySelector('.sheet');},document.querySelector('h1').textContent);}
document.addEventListener('click',function(e){var b=e.target.closest('.copy');if(!b)return;var t=b.getAttribute('data-copy')||'';var done=function(){var o=b.textContent;b.textContent='Copied';setTimeout(function(){b.textContent=o;},1200);};if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done,function(){});}else{var a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');done();}catch(x){}a.remove();}});
</script>
</body>
</html>
