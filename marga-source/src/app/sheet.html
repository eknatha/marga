<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}} cheat sheet | MARGA by EknathaLabs</title>
<meta name="description" content="{{SUMMARY}}">
<link rel="canonical" href="{{SITE}}/cheatsheets/{{ID}}.html">
<meta property="og:title" content="{{TITLE}} cheat sheet">
<meta property="og:description" content="{{SUMMARY}}">
<meta property="og:url" content="{{SITE}}/cheatsheets/{{ID}}.html">
<meta name="theme-color" content="#0F2547">
<link rel="icon" href="../icon.svg" type="image/svg+xml">
<script>
(function(){try{var t=localStorage.getItem('ea.theme');if(!t){t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}document.documentElement.setAttribute('data-theme',t);}catch(e){document.documentElement.setAttribute('data-theme','light');}})();
</script>
<link rel="stylesheet" href="../assets/app.css?v={{VER}}">
</head>
<body class="standalone">
<header class="topbar"><div class="wrap topbar-in">
  <a class="brand" href="../"><img src="../icon.svg" alt="" width="26" height="26"><span><b>MARGA</b><span class="bn"> by EknathaLabs</span></span></a>
  <nav class="topnav" aria-label="Cheat sheets"><a href="./">All cheat sheets</a><a href="../#/">Learning paths</a></nav>
</div></header>
<main class="wrap sheet-page" id="main">
  <header class="page-head">
    <h1>{{TITLE}} cheat sheet</h1>
    <p class="lede">{{SUMMARY}}</p>
    <div class="actions"><button class="btn btn-quiet" type="button" onclick="window.print()">Print or save as PDF</button></div>
  </header>
  <article class="sheet">{{BODY}}</article>
</main>
<footer class="foot"><div class="wrap foot-in"><span>MARGA by EknathaLabs</span><a href="https://eknathalabs.com" rel="noopener">Blog</a><a href="https://eknathalabs.substack.com" rel="noopener">Newsletter</a></div></footer>
<script>
document.addEventListener('click',function(e){var b=e.target.closest('.copy');if(!b)return;var t=b.getAttribute('data-copy')||'';var done=function(){var o=b.textContent;b.textContent='Copied';setTimeout(function(){b.textContent=o;},1200);};if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done,function(){});}else{var a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');done();}catch(x){}a.remove();}});
</script>
</body>
</html>
